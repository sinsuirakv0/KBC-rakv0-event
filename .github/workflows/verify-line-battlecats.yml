name: Verify LINE Battle Cats update endpoint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout monitor
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify health and authenticated route
        env:
          LINE_BOT_UPDATE_URL: ${{ secrets.LINE_BOT_EVENT_UPDATE_URL }}
        run: node scripts/verify-line-battlecats.js
